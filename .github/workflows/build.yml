name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix and Build Android
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --project-name asabispeak

          M=android/app/src/main/AndroidManifest.xml

          if ! grep -q "OverlayService" $M; then
            sed -i 's#</application>#    <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" />\n    </application>#' $M
          fi

          if ! grep -q "SYSTEM_ALERT_WINDOW" $M; then
            sed -i '0,/<application/s#<application#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application#' $M
          fi

          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsabiSpeak-APK
          path: build/app/outputs/flutter-apk/app-release.apk
